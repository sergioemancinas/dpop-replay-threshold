server:
  port: ${SERVER_PORT:8081}
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: d2-dpop-resource-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
          # FAPI 2.0 mandates ES256. RS256 is retained only so a misconfigured realm
          # fails on the algorithm assertion rather than silently at key selection.
          jws-algorithms:
            - ES256
            - RS256
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # Short timeouts so an unreachable primary surfaces as an exception the validator
      # can fail closed on, rather than as a stalled request.
      timeout: 500ms
      connect-timeout: 500ms

dpop:
  jti:
    # default = Spring Security's process-local JtiClaimValidator only.
    # redis   = that chain plus a shared jti cache, installed through
    #           DPoPProofJwtDecoderFactory.setJwtValidatorFactory.
    cache: ${DPOP_JTI_CACHE:default}
    key-prefix: "dpop:jti:"
    # JwtIssuedAtValidator accepts iat within +/- 60 s of now, so a proof first seen at t0
    # with iat = t0 + 60 stays iat-valid until t0 + 120. 120 s is the tight lower bound
    # with synchronised clocks; each replica checks iat against its own clock while Redis
    # expires the key on its clock, so 5 s are added for clock offset between them.
    redis-ttl-seconds: 125

node:
  id: ${NODE_ID:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # The fail-closed check deliberately runs with Redis stopped. The process must stay
      # up and answer 401 rather than report itself DOWN and be restarted.
      enabled: false

logging:
  level:
    org.springframework.security: INFO
