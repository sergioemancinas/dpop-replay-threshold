# Round-robin fan-out over the three resource-server replicas.
#
# One worker only. Each NGINX worker keeps its own round-robin cursor, so with several
# workers the replica a given request lands on is not predictable from the request index,
# and the cross-replica assertions become racy.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream resource_servers {
        server rs-1:8081;
        server rs-2:8081;
        server rs-3:8081;
    }

    server {
        listen 8190;

        location / {
            proxy_pass http://resource_servers;
            proxy_http_version 1.1;

            # Host is forwarded verbatim, port included. Tomcat rebuilds
            # getRequestURL() from it and Spring Security compares that string to the htu
            # claim the client signed. Rewriting Host to the upstream name would fail every
            # proof on htu, masking the jti behaviour under test.
            proxy_set_header Host $http_host;

            # 401 is a legitimate outcome here, not an upstream fault. Retrying it on the
            # next replica would silently turn one presentation into several.
            proxy_next_upstream off;
        }
    }
}
