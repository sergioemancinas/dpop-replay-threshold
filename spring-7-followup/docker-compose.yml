name: oauth-replay-spring7

# Same stack as single-host-validation/, with the resource server on Spring Security
# 7.1.2 instead of 6.5.5. Keycloak, realm and client are unchanged.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
      - --features=dpop
      - --hostname=http://localhost:8080
      - --hostname-backchannel-dynamic=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../single-host-validation/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"

  resource-server:
    build: ./resource-server
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/dpop-demo
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dpop-demo/protocol/openid-connect/certs
      SERVER_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - keycloak
    restart: on-failure
